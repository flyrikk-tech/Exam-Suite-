<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PocketPilot - Offline Practice Suite</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PocketPilot">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --oral-accent: #f43f5e;
      --oral-hover: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #fbbf24;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }

    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }
    
    .btn-oral { background: transparent; color: var(--oral-accent); border: 1px solid var(--oral-accent); }
    .btn-oral:hover { background: rgba(244, 63, 94, 0.1); }
    .btn-oral-solid { background: var(--oral-accent); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-oral-solid:hover { background: var(--oral-hover); }

    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.6rem; font-size: 0.85rem; }
    .btn-danger:hover { background: var(--danger); color: white; }
    
    .btn-success { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); padding: 0.6rem 1.2rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-success:hover { background: var(--success); color: white; }

    .textarea-import { width: 100%; height: 140px; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: monospace; margin-top: 1rem; resize: vertical; line-height: 1.4; }

    .bank-list { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    
    .bank-item { background: #0f172a; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .bank-header { padding: 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
    .bank-header:hover { background: #162440; }
    .bank-name { font-weight: 600; color: var(--text); font-size: 1.1rem; }
    .bank-count { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .bank-content { display: none; padding: 1rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
    .bank-content.active { display: block; }
    .bank-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; width: 100%; justify-content: flex-end; margin-top: 0.5rem; }
    
    .select-exam { background: #1e293b; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem; font-size: 0.85rem; outline: none; }
    .checkbox-container { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--accent); cursor: pointer; flex-basis: 100%; margin-bottom: 0.5rem; background: rgba(56, 189, 248, 0.05); padding: 0.5rem; border-radius: 6px; }
    .checkbox-container input { cursor: pointer; transform: scale(1.1); }

    .checkbox-container-oral { color: var(--oral-accent); background: rgba(244, 63, 94, 0.05); }

    .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.2rem; line-height: 1.5; }
    .answer-box { font-size: 1.1rem; color: var(--success); background: rgba(34, 197, 94, 0.1); padding: 1rem; border-radius: 8px; border: 1px solid var(--success); margin-bottom: 1.5rem; white-space: pre-wrap; line-height: 1.5;}
    
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.85rem; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #13203c; }
    .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--success) !important; color: var(--success); }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: var(--danger); }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
    .hidden { display: none !important; }
    
    .flex-center { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>PocketPilot</h1>
    <div id="stats" class="bank-count" style="text-align: right;">0 spørsmål totalt</div>
  </header>

  <!-- Seksjon 1: Import -->
  <section class="card" id="importSection">
    <h2 style="font-size: 1.15rem;">Opprett ny spørsmålsbank</h2>
    <div style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
      <button class="btn btn-outline" style="flex: 1; font-size: 0.9rem; padding: 0.5rem;" onclick="toggleImportArea('mc')">+ Flervalg (Skriftlig)</button>
      <button class="btn btn-oral" style="flex: 1; font-size: 0.9rem; padding: 0.5rem;" onclick="toggleImportArea('oral')">+ Spørsmål/Svar (Muntlig)</button>
    </div>
    
    <!-- Import Flervalg -->
    <div id="importAreaMC" class="hidden" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        <b>Skriftlig (Flervalg):</b> Lim inn spørsmål med alternativer (a, b, c). Husk stjerne (*) foran riktig svar.
      </p>
      <textarea id="wordInput" class="textarea-import" placeholder="1. What is the minimum altitude...\n a) 1000 ft\n*b) 2000 ft\n c) 3000 ft"></textarea>
      <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
        <button class="btn" onclick="parseWordText()">Lagre skriftlig bank</button>
      </div>
    </div>

    <!-- Import Muntlig -->
    <div id="importAreaOral" class="hidden" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        <b>Muntlig (Flashcards):</b> Bruk <b>Q:</b> foran spørsmålet og <b>A:</b> foran svaret.
      </p>
      <textarea id="oralInput" class="textarea-import" placeholder="Q: What is the maximum takeoff weight?\nA: 73,000 lbs\n\nQ: What is the maximum operating altitude?\nA: 51,000 ft"></textarea>
      <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
        <button class="btn btn-oral-solid" onclick="parseOralText()">Lagre muntlig bank</button>
      </div>
    </div>
  </section>

  <!-- Seksjon 2: Banklister -->
  <section class="card" id="bankListSectionMC">
    <h2 style="font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--accent);">ATPL</h2>
    <div class="bank-list" id="bankList"></div>
  </section>

  <section class="card" id="bankListSectionOral">
    <h2 style="font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--oral-accent);">Flashcards</h2>
    <div class="bank-list" id="oralBankList"></div>
  </section>

  <!-- Seksjon 3: Quizer -->
  
  <!-- Skriftlig Quiz -->
  <section class="card hidden" id="quizCard">
    <div class="status-bar">
      <span id="quizBankName" style="font-weight: 600; color: var(--accent);">Ingen bank valgt</span>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="quizProgress">0 / 0</span>
        <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="exitQuiz()">Avslutt</button>
      </div>
    </div>
    <div id="questionContainer"></div>
    <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
      <button id="prevBtn" class="btn btn-outline hidden" onclick="prevQuestion()">← Forrige</button>
      <button id="nextBtn" class="btn hidden">Neste →</button>
    </div>
  </section>

  <!-- Muntlig Quiz -->
  <section class="card hidden" id="oralQuizCard">
    <div class="status-bar">
      <span id="oralQuizBankName" style="font-weight: 600; color: var(--oral-accent);">Ingen bank valgt</span>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="oralQuizProgress">0 / 0</span>
        <button class="btn-oral btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="exitQuiz()">Avslutt</button>
      </div>
    </div>
    
    <div id="oralQuestionContainer"></div>
    
    <div id="oralShowAnswerDiv" class="flex-center" style="margin-top: 2rem;">
      <button class="btn btn-oral-solid" style="padding: 1rem 2rem; font-size: 1.1rem;" onclick="revealOralAnswer()">Vis fasit</button>
    </div>

    <div id="oralAnswerContainer" class="hidden"></div>

    <div id="oralActionDiv" class="flex-center hidden" style="margin-top: 1.5rem;">
      <button class="btn btn-success" style="flex:1; max-width: 250px;" onclick="scoreOralAnswer(true)">Jeg kunne denne! 😎</button>
      <button class="btn btn-danger" style="flex:1; max-width: 250px; font-weight: 600; font-size: 1rem; padding: 0.6rem;" onclick="scoreOralAnswer(false)">Må øve mer 🔄</button>
    </div>

    <div style="display: flex; justify-content: flex-start; margin-top: 2rem;">
      <button id="oralPrevBtn" class="btn-oral btn-outline hidden" onclick="prevOralQuestion()">← Forrige spørsmål</button>
    </div>
  </section>

</div>

<script>
  const STORAGE_KEY = "offline_exam_banks";              
  const STATS_KEY = "offline_exam_mastery_stats";        
  const ORAL_STORAGE_KEY = "offline_oral_banks";         
  const ORAL_STATS_KEY = "offline_oral_mastery_stats";   
  
  let currentBank = null;
  let activeQuestions = [];
  let wrongQuestions = [];
  let currentIndex = 0;
  let currentMode = ""; 

  function loadBanks() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
  function saveBanks(banks) { localStorage.setItem(STORAGE_KEY, JSON.stringify(banks)); renderBankList(); updateTotalStats(); }
  function loadStats() { try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch { return {}; } }
  function saveStats(stats) { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }

  function loadOralBanks() { try { return JSON.parse(localStorage.getItem(ORAL_STORAGE_KEY)) || {}; } catch { return {}; } }
  function saveOralBanks(banks) { localStorage.setItem(ORAL_STORAGE_KEY, JSON.stringify(banks)); renderOralBankList(); updateTotalStats(); }
  function loadOralStats() { try { return JSON.parse(localStorage.getItem(ORAL_STATS_KEY)) || {}; } catch { return {}; } }
  function saveOralStats(stats) { localStorage.setItem(ORAL_STATS_KEY, JSON.stringify(stats)); }

  // Helt trygg funksjon for å fjerne koder som dukker opp, UTEN å krasje nettleseren
  function cleanText(text) {
    if (!text) return "";
    let clean = text;
    // Fjerner og andre uønskede system-tags vi har sett
    clean = clean.replace(/\/gi, "");
    clean = clean.replace(/\(start_span\)/gi, "");
    clean = clean.replace(/\(end_span\)/gi, "");
    clean = clean.replace(/\[start_span\]/gi, "");
    clean = clean.replace(/\[end_span\]/gi, "");
    return clean;
  }

  function updateTotalStats() {
    const banks = loadBanks();
    const oralBanks = loadOralBanks();
    let totalQuestions = 0;
    Object.values(banks).forEach(qList => totalQuestions += qList.length);
    Object.values(oralBanks).forEach(qList => totalQuestions += qList.length);
    document.getElementById("stats").textContent = `${totalQuestions} spørsmål totalt`;
  }

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function toggleImportArea(type) {
    const mcArea = document.getElementById("importAreaMC");
    const oralArea = document.getElementById("importAreaOral");
    
    if (type === 'mc') {
      mcArea.classList.toggle("hidden");
      oralArea.classList.add("hidden");
    } else {
      oralArea.classList.toggle("hidden");
      mcArea.classList.add("hidden");
    }
  }

  function toggleBankDetails(idPrefix, index) {
    const content = document.getElementById(`content-${idPrefix}-${index}`);
    const icon = document.getElementById(`icon-${idPrefix}-${index}`);
    
    document.querySelectorAll('.bank-content').forEach(el => {
      if(el.id !== `content-${idPrefix}-${index}`) el.classList.remove('active');
    });
    document.querySelectorAll('.bank-icon').forEach(el => {
      if(el.id !== `icon-${idPrefix}-${index}`) el.textContent = '▼';
    });

    if (content.classList.contains("active")) {
      content.classList.remove("active");
      icon.textContent = "▼";
    } else {
      content.classList.add("active");
      icon.textContent = "▲";
    }
  }

  function exitQuiz() {
    currentBank = null; activeQuestions = []; wrongQuestions = []; currentIndex = 0; currentMode = "";
    renderBankList(); renderOralBankList();
    document.getElementById("importSection").classList.remove("hidden");
    document.getElementById("bankListSectionMC").classList.remove("hidden");
    document.getElementById("bankListSectionOral").classList.remove("hidden");
    document.getElementById("quizCard").classList.add("hidden");
    document.getElementById("oralQuizCard").classList.add("hidden");
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ==========================================
  // MODUL: MUNTLIG EKSAMEN (FLASHCARDS)
  // ==========================================

  function parseOralText() {
    const text = document.getElementById("oralInput").value;
    if (!text.trim()) { alert("Tekstfeltet er tomt."); return; }

    const lines = text.split('\n');
    const questions = [];
    let currentQ = "";
    let currentA = "";
    let mode = ""; 

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;
      
      line = cleanText(line).trim();

      if (/^(Q:|Spørsmål:)\s*/i.test(line)) {
        if (currentQ && currentA) {
          questions.push({ question: currentQ, answer: currentA });
        }
        currentQ = line.replace(/^(Q:|Spørsmål:)\s*/i, '');
        currentA = "";
        mode = "q";
      } else if (/^(A:|Svar:)\s*/i.test(line)) {
        currentA = line.replace(/^(A:|Svar:)\s*/i, '');
        mode = "a";
      } else {
        if (mode === "q") currentQ += "\n" + line;
        else if (mode === "a") currentA += "\n" + line;
      }
    }
    if (currentQ && currentA) questions.push({ question: currentQ, answer: currentA });

    if (questions.length === 0) {
      alert("Klarte ikke å finne noen spørsmål. Pass på at du starter spørsmål med Q: og svar med A:.");
      return;
    }

    const bankName = prompt(`Fant ${questions.length} flashcards! Gi banken et navn:`, "Flashcards Bank");
    if (bankName) {
      const banks = loadOralBanks();
      if (banks[bankName] && !confirm(`Banken "${bankName}" eksisterer allerede. Overskrive?`)) return;
      banks[bankName] = questions;
      saveOralBanks(banks);
      
      const stats = loadOralStats();
      stats[bankName] = { correctIndices: [] };
      saveOralStats(stats);
      
      alert(`Lagret ${questions.length} spørsmål i "${bankName}".`);
      document.getElementById("oralInput").value = "";
      toggleImportArea('oral');
    }
  }

  function deleteOralBank(bankName, event) {
    event.stopPropagation();
    if (!confirm(`Vil du slette flashcards-banken "${bankName}"?`)) return;
    const banks = loadOralBanks();
    delete banks[bankName];
    saveOralBanks(banks);
    const stats = loadOralStats();
    delete stats[bankName];
    saveOralStats(stats);
    renderOralBankList();
  }

  function renderOralBankList() {
    const banks = loadOralBanks();
    const stats = loadOralStats();
    const bankListEl = document.getElementById("oralBankList");
    bankListEl.innerHTML = "";

    const bankKeys = Object.keys(banks);
    if (bankKeys.length === 0) {
      bankListEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Ingen flashcards lagret enda.</p>';
      return;
    }

    bankKeys.forEach((bankName, index) => {
      const qCount = banks[bankName].length;
      const bStats = stats[bankName] || { correctIndices: [] };
      const mastered = (bStats.correctIndices || []).length;
      const pct = Math.round((mastered / qCount) * 100) || 0;
      
      let colorCode = "var(--danger)";
      if (pct >= 85) colorCode = "var(--success)";
      else if (pct >= 40) colorCode = "var(--warning)";

      let statsBadge = `<span style="color: ${colorCode}; font-weight: 600; font-size: 0.85rem;">${pct}% mestret</span>`;
      const cbId = `skip-oral-${index}`;
      const selectId = `mode-oral-${index}`;
      
      let checkboxHtml = "";
      if (mastered > 0 && mastered < qCount) {
        checkboxHtml = `<label class="checkbox-container checkbox-container-oral" for="${cbId}"><input type="checkbox" id="${cbId}">Skjul de ${mastered} jeg allerede kan</label>`;
      } else if (mastered === qCount) {
        checkboxHtml = `<label class="checkbox-container checkbox-container-oral" for="${cbId}" style="color: var(--success);"><input type="checkbox" id="${cbId}" checked>Du har mestret alle! (Fjern krysset for ny runde)</label>`;
      }

      const item = document.createElement("div");
      item.className = "bank-item";
      item.innerHTML = `
        <div class="bank-header" onclick="toggleBankDetails('oral', ${index})">
          <div><div class="bank-name">${bankName}</div><div class="bank-count">${qCount} flashcards totalt</div></div>
          <div style="display: flex; align-items: center; gap: 1rem;">${statsBadge}<span id="icon-oral-${index}" class="bank-icon" style="color: var(--text-muted); font-size: 0.75rem;">▼</span></div>
        </div>
        <div class="bank-content" id="content-oral-${index}">
          ${checkboxHtml}
          <div class="bank-actions">
            <select id="${selectId}" class="select-exam">
              <option value="all">Ta alle</option>
              <option value="10">Kjapp runde (10 spm)</option>
              <option value="20">Middels runde (20 spm)</option>
            </select>
            <button class="btn btn-oral-solid" onclick="startOralQuiz('${bankName}', document.getElementById('${selectId}').value, '${cbId}')">Start</button>
            <button class="btn btn-danger" onclick="deleteOralBank('${bankName}', event)">Slett</button>
          </div>
        </div>
      `;
      bankListEl.appendChild(item);
    });
  }

  function startOralQuiz(bankName, mode, skipCheckboxId) {
    const banks = loadOralBanks();
    if (!banks[bankName]) return;
    
    currentBank = bankName;
    currentIndex = 0;
    wrongQuestions = [];
    currentMode = "oral";
    
    let allQ = banks[bankName].map((q, idx) => ({ ...q, originalIndex: idx }));
    const skipCheckbox = document.getElementById(skipCheckboxId);
    
    if (skipCheckbox && skipCheckbox.checked) {
      const stats = loadOralStats();
      const correctSet = new Set(stats[bankName]?.correctIndices || []);
      allQ = allQ.filter(q => !correctSet.has(q.originalIndex));
      if (allQ.length === 0) {
        alert("Du har allerede mestret alle spørsmålene i dette utvalget. Fjern krysset for å ta dem på nytt.");
        return;
      }
    }
    
    allQ = shuffleArray(allQ);
    if (mode === "all") activeQuestions = allQ;
    else activeQuestions = allQ.slice(0, parseInt(mode));
    
    document.getElementById("importSection").classList.add("hidden");
    document.getElementById("bankListSectionMC").classList.add("hidden");
    document.getElementById("bankListSectionOral").classList.add("hidden");
    document.getElementById("oralQuizCard").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderOralQuestion();
  }

  function retryWrongOralQuestions() {
    activeQuestions = shuffleArray([...wrongQuestions]);
    wrongQuestions = [];
    currentIndex = 0;
    renderOralQuestion();
  }

  function prevOralQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      const q = activeQuestions[currentIndex];
      wrongQuestions = wrongQuestions.filter(wq => wq.originalIndex !== q.originalIndex);
      renderOralQuestion();
    }
  }

  function renderOralQuestion() {
    const q = activeQuestions[currentIndex];
    document.getElementById("oralQuizBankName").textContent = currentBank;
    document.getElementById("oralQuizProgress").textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
    
    document.getElementById("oralQuestionContainer").innerHTML = `<div class="question-box">${q.question}</div>`;
    
    document.getElementById("oralAnswerContainer").classList.add("hidden");
    document.getElementById("oralActionDiv").classList.add("hidden");
    document.getElementById("oralShowAnswerDiv").classList.remove("hidden");

    if (currentIndex > 0) {
      document.getElementById("oralPrevBtn").classList.remove("hidden");
    } else {
      document.getElementById("oralPrevBtn").classList.add("hidden");
    }
  }

  function revealOralAnswer() {
    const q = activeQuestions[currentIndex];
    document.getElementById("oralShowAnswerDiv").classList.add("hidden");
    
    const ansContainer = document.getElementById("oralAnswerContainer");
    ansContainer.innerHTML = `<div class="answer-box">${q.answer}</div>`;
    ansContainer.classList.remove("hidden");
    
    document.getElementById("oralActionDiv").classList.remove("hidden");
  }

  function scoreOralAnswer(isCorrect) {
    const q = activeQuestions[currentIndex];
    const stats = loadOralStats();
    if (!stats[currentBank]) stats[currentBank] = { correctIndices: [] };

    if (!isCorrect) {
      wrongQuestions.push(q);
      stats[currentBank].correctIndices = stats[currentBank].correctIndices.filter(idx => idx !== q.originalIndex);
    } else {
      if (!stats[currentBank].correctIndices.includes(q.originalIndex)) {
        stats[currentBank].correctIndices.push(q.originalIndex);
      }
    }
    saveOralStats(stats);
    
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderOralQuestion();
    } else {
      finishOralQuiz();
    }
  }

  function finishOralQuiz() {
    let endMessage = `<div class="question-box" style="text-align: center; color: var(--success); margin: 1rem 0;">🎉 Høringen er fullført!</div>`;
    
    document.getElementById("oralAnswerContainer").classList.add("hidden");
    document.getElementById("oralActionDiv").classList.add("hidden");
    document.getElementById("oralShowAnswerDiv").classList.add("hidden");
    document.getElementById("oralPrevBtn").classList.add("hidden");

    if (wrongQuestions.length > 0) {
      endMessage += `<p style="text-align:center; color: var(--text-muted); margin-bottom: 1.5rem;">Du valgte "Må øve mer" på <b>${wrongQuestions.length}</b> av ${activeQuestions.length} flashcards.</p>`;
      endMessage += `
        <div style="display:flex; justify-content:center; gap: 1rem; flex-wrap: wrap;">
          <button class="btn btn-danger" onclick="retryWrongOralQuestions()">Repeter ${wrongQuestions.length} flashcards</button>
          <button class="btn btn-outline" onclick="exitQuiz()">Tilbake til oversikten</button>
        </div>`;
    } else {
      endMessage += `<p style="text-align:center; color: var(--success); margin-bottom: 1.5rem;">Alt satt som et skudd! Strålende jobbet.</p>`;
      endMessage += `<div style="display:flex; justify-content:center;"><button class="btn btn-outline" onclick="exitQuiz()">Tilbake til oversikten</button></div>`;
    }

    document.getElementById("oralQuestionContainer").innerHTML = endMessage;
  }

  // ==========================================
  // MODUL: SKRIFTLIG EKSAMEN (FLERVALG)
  // ==========================================

  function parseWordText() {
    const text = document.getElementById("wordInput").value;
    if (!text.trim()) { alert("Tekstfeltet er tomt."); return; }

    const lines = text.split('\n');
    const questions = [];
    let currentQ = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;
      
      line = cleanText(line);
      line = line.replace(/^\[.*?\]\s*/, ''); 
      line = line.trim();

      if (/^\d+\./.test(line)) {
        if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
        currentQ = { question: line.replace(/^\d+\.\s*/, ''), options: [], answer: 0 };
      } else if (/^\*?\s?[a-e]\)/i.test(line)) {
        if (currentQ) {
          const isCorrect = line.includes('*');
          const optText = line.replace(/^\*?\s?[a-e]\)\s*/i, '');
          currentQ.options.push(optText);
          if (isCorrect) currentQ.answer = currentQ.options.length - 1;
        }
      } else if (currentQ && currentQ.options.length === 0) {
        currentQ.question += " " + line;
      }
    }

    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

    if (questions.length === 0) {
      alert("Klarte ikke å finne noen spørsmål. Sjekk formatet.");
      return;
    }

    const bankName = prompt(`Fant ${questions.length} spørsmål! Gi banken et navn:`, "Ny Spørsmålsbank");
    if (bankName) {
      const banks = loadBanks();
      if (banks[bankName] && !confirm(`Banken "${bankName}" eksisterer allerede. Overskrive?`)) return;
      banks[bankName] = questions;
      saveBanks(banks);
      
      const stats = loadStats();
      stats[bankName] = { correctIndices: [] };
      saveStats(stats);
      
      alert(`Lagret ${questions.length} spørsmål i banken "${bankName}".`);
      document.getElementById("wordInput").value = "";
      toggleImportArea('mc');
    }
  }

  function deleteBank(bankName, event) {
    event.stopPropagation();
    if (!confirm(`Vil du slette "${bankName}"? All lagret statistikk vil også forsvinne.`)) return;
    const banks = loadBanks();
    delete banks[bankName];
    saveBanks(banks);

    const stats = loadStats();
    delete stats[bankName];
    saveStats(stats);

    renderBankList();
  }

  function renderBankList() {
    const banks = loadBanks();
    const stats = loadStats();
    const bankListEl = document.getElementById("bankList");
    bankListEl.innerHTML = "";

    const bankKeys = Object.keys(banks);
    if (bankKeys.length === 0) {
      bankListEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Ingen skriftlige banker lagret enda.</p>';
      return;
    }

    bankKeys.forEach((bankName, index) => {
      const qCount = banks[bankName].length;
      const bStats = stats[bankName] || { correctIndices: [] };
      const mastered = (bStats.correctIndices || []).length;
      const pct = Math.round((mastered / qCount) * 100) || 0;
      
      let colorCode = "var(--danger)";
      if (pct >= 85) colorCode = "var(--success)";
      else if (pct >= 40) colorCode = "var(--warning)";

      let statsBadge = `<span style="color: ${colorCode}; font-weight: 600; font-size: 0.85rem;">${pct}% mestret</span>`;
      const cbId = `skip-mc-${index}`;
      const selectId = `mode-mc-${index}`;
      let checkboxHtml = "";
      
      if (mastered > 0 && mastered < qCount) {
        checkboxHtml = `<label class="checkbox-container" for="${cbId}"><input type="checkbox" id="${cbId}">Skjul de ${mastered} spørsmålene jeg allerede har svart riktig på</label>`;
      } else if (mastered === qCount) {
        checkboxHtml = `<label class="checkbox-container" for="${cbId}" style="color: var(--success);"><input type="checkbox" id="${cbId}" checked>Du har mestret alle! (Fjern krysset for å øve på nytt)</label>`;
      }

      const item = document.createElement("div");
      item.className = "bank-item";
      item.innerHTML = `
        <div class="bank-header" onclick="toggleBankDetails('mc', ${index})">
          <div><div class="bank-name">${bankName}</div><div class="bank-count">${qCount} spørsmål totalt</div></div>
          <div style="display: flex; align-items: center; gap: 1rem;">${statsBadge}<span id="icon-mc-${index}" class="bank-icon" style="color: var(--text-muted); font-size: 0.75rem;">▼</span></div>
        </div>
        <div class="bank-content" id="content-mc-${index}">
          ${checkboxHtml}
          <div class="bank-actions">
            <select id="${selectId}" class="select-exam">
              <option value="all">Ta alle</option>
              <option value="10">Eksamen (10 spm)</option>
              <option value="20">Eksamen (20 spm)</option>
              <option value="50">Eksamen (50 spm)</option>
            </select>
            <button class="btn" onclick="startQuiz('${bankName}', document.getElementById('${selectId}').value, '${cbId}')">Start</button>
            <button class="btn btn-danger" onclick="deleteBank('${bankName}', event)">Slett</button>
          </div>
        </div>
      `;
      bankListEl.appendChild(item);
    });
  }

  function startQuiz(bankName, mode, skipCheckboxId) {
    const banks = loadBanks();
    if (!banks[bankName]) return;
    
    currentBank = bankName;
    currentIndex = 0;
    wrongQuestions = [];
    currentMode = "mc";
    
    let allQ = banks[bankName].map((q, idx) => ({ ...q, originalIndex: idx }));
    const skipCheckbox = document.getElementById(skipCheckboxId);
    
    if (skipCheckbox && skipCheckbox.checked) {
      const stats = loadStats();
      const correctSet = new Set(stats[bankName]?.correctIndices || []);
      allQ = allQ.filter(q => !correctSet.has(q.originalIndex));
      if (allQ.length === 0) {
        alert("Du har allerede mestret alle spørsmålene i dette utvalget."); return;
      }
    }
    
    allQ = shuffleArray(allQ);
    if (mode === "all") activeQuestions = allQ;
    else activeQuestions = allQ.slice(0, parseInt(mode));
    
    document.getElementById("importSection").classList.add("hidden");
    document.getElementById("bankListSectionMC").classList.add("hidden");
    document.getElementById("bankListSectionOral").classList.add("hidden");
    document.getElementById("quizCard").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderQuestion();
  }

  function retryWrongQuestions() {
    activeQuestions = shuffleArray([...wrongQuestions]);
    wrongQuestions = [];
    currentIndex = 0;
    renderQuestion();
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      const q = activeQuestions[currentIndex];
      wrongQuestions = wrongQuestions.filter(wq => wq.originalIndex !== q.originalIndex);
      renderQuestion();
    }
  }

  function renderQuestion() {
    const q = activeQuestions[currentIndex];
    document.getElementById("quizBankName").textContent = currentBank;
    document.getElementById("quizProgress").textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
    document.getElementById("nextBtn").classList.add("hidden");

    if (currentIndex > 0) {
      document.getElementById("prevBtn").classList.remove("hidden");
    } else {
      document.getElementById("prevBtn").classList.add("hidden");
    }

    const container = document.getElementById("questionContainer");
    container.innerHTML = `<div class="question-box">${q.question}</div><div class="options-grid" id="optionsGrid"></div>`;

    const grid = document.getElementById("optionsGrid");
    let optionsWithStatus = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
    optionsWithStatus = shuffleArray(optionsWithStatus);
    let newCorrectIndex = optionsWithStatus.findIndex(o => o.isCorrect);

    optionsWithStatus.forEach((optObj, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = optObj.text;
      btn.onclick = () => selectAnswer(idx, newCorrectIndex, btn);
      grid.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex, correctIndex, clickedBtn) {
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) btn.classList.add("correct");
    });

    const q = activeQuestions[currentIndex];
    const stats = loadStats();
    if (!stats[currentBank]) stats[currentBank] = { correctIndices: [] };

    if (selectedIndex !== correctIndex) {
      clickedBtn.classList.add("wrong");
      wrongQuestions.push(q);
      stats[currentBank].correctIndices = stats[currentBank].correctIndices.filter(idx => idx !== q.originalIndex);
    } else {
      if (!stats[currentBank].correctIndices.includes(q.originalIndex)) {
        stats[currentBank].correctIndices.push(q.originalIndex);
      }
    }
    
    saveStats(stats);
    document.getElementById("nextBtn").classList.remove("hidden");
  }

  document.getElementById("nextBtn").onclick = () => {
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      let endMessage = `<div class="question-box" style="text-align: center; color: var(--success); margin: 1rem 0;">🎉 Quizen er fullført!</div>`;
      document.getElementById("prevBtn").classList.add("hidden");
      
      if (wrongQuestions.length > 0) {
        endMessage += `<p style="text-align:center; color: var(--text-muted); margin-bottom: 1.5rem;">Du hadde <b>${wrongQuestions.length}</b> feil av ${activeQuestions.length} mulige.</p>`;
        endMessage += `
          <div style="display:flex; justify-content:center; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-danger" onclick="retryWrongQuestions()">Repeter ${wrongQuestions.length} feil</button>
            <button class="btn btn-outline" onclick="exitQuiz()">Tilbake til oversikten</button>
          </div>`;
      } else {
        endMessage += `<p style="text-align:center; color: var(--success); margin-bottom: 1.5rem;">Alt var riktig! Strålende jobbet.</p>`;
        endMessage += `<div style="display:flex; justify-content:center;"><button class="btn btn-outline" onclick="exitQuiz()">Tilbake til oversikten</button></div>`;
      }
      document.getElementById("questionContainer").innerHTML = endMessage;
      document.getElementById("nextBtn").classList.add("hidden");
    }
  };

  // Kjøres ved oppstart
  renderBankList();
  renderOralBankList();
  updateTotalStats();
</script>
