<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Exam & Mastery Practice Suite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }

    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.6rem; font-size: 0.85rem; }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Bank management styling */
    .bank-list { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    .bank-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); }
    .bank-meta { display: flex; flex-direction: column; gap: 0.2rem; }
    .bank-name { font-weight: 600; color: var(--text); }
    .bank-count { font-size: 0.85rem; color: var(--text-muted); }
    .bank-actions { display: flex; gap: 0.5rem; align-items: center; }

    /* Quiz styling */
    .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.2rem; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.85rem; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #13203c; }
    .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--success) !important; color: var(--success); }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: var(--danger); }
    
    .status-bar { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Offline Exam & Mastery Practice Suite</h1>
    <div id="stats" class="bank-count">0 spørsmål totalt</div>
  </header>

  <!-- Import and Bank Management Section -->
  <section class="card">
    <h2 style="font-size: 1.15rem; margin-bottom: 0.5rem;">Administrer Spørsmålsbanker</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
      Last opp spørsmål (JSON-format: array med objekter bestående av <code>question</code>, <code>options</code> og <code>answer</code>).
    </p>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <input type="file" id="fileInput" accept=".json" style="color: var(--text-muted);" />
    </div>

    <div class="bank-list" id="bankList">
      <!-- Genereres dynamisk -->
    </div>
  </section>

  <!-- Quiz Runner Section -->
  <section class="card" id="quizCard">
    <div class="status-bar">
      <span id="quizBankName">Ingen bank valgt</span>
      <span id="quizProgress">0 / 0</span>
    </div>
    <div id="questionContainer">
      <p style="color: var(--text-muted);">Velg eller last inn en spørsmålsbank for å starte.</p>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
      <button id="nextBtn" class="btn hidden">Neste spørsmål</button>
    </div>
  </section>
</div>

<script>
  // Datastruktur i localStorage: { [bankName: string]: Array<{question, options, answer}> }
  const STORAGE_KEY = "offline_exam_banks";
  let currentBank = null;
  let currentIndex = 0;

  function loadBanks() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveBanks(banks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(banks));
    renderBankList();
    updateTotalStats();
  }

  function updateTotalStats() {
    const banks = loadBanks();
    let totalQuestions = 0;
    Object.values(banks).forEach(qList => totalQuestions += qList.length);
    document.getElementById("stats").textContent = `${totalQuestions} spørsmål fordelt på ${Object.keys(banks).length} banker`;
  }

  // Sletter en spesifikk spørsmålsbank
  function deleteBank(bankName) {
    const confirmed = confirm(`Er du sikker på at du vil slette spørsmålsbanken "${bankName}"?`);
    if (!confirmed) return;

    const banks = loadBanks();
    delete banks[bankName];
    saveBanks(banks);

    // Hvis den slettede banken var i gang, tilbakestill quiz-visningen
    if (currentBank === bankName) {
      currentBank = null;
      currentIndex = 0;
      document.getElementById("quizBankName").textContent = "Ingen bank valgt";
      document.getElementById("quizProgress").textContent = "0 / 0";
      document.getElementById("questionContainer").innerHTML = '<p style="color: var(--text-muted);">Velg eller last inn en spørsmålsbank for å starte.</p>';
      document.getElementById("nextBtn").classList.add("hidden");
    }
  }

  function renderBankList() {
    const banks = loadBanks();
    const bankListEl = document.getElementById("bankList");
    bankListEl.innerHTML = "";

    const bankKeys = Object.keys(banks);
    if (bankKeys.length === 0) {
      bankListEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Ingen banker lagret enda.</p>';
      return;
    }

    bankKeys.forEach(bankName => {
      const qCount = banks[bankName].length;

      const item = document.createElement("div");
      item.className = "bank-item";

      item.innerHTML = `
        <div class="bank-meta">
          <span class="bank-name">${bankName}</span>
          <span class="bank-count">${qCount} spørsmål</span>
        </div>
        <div class="bank-actions">
          <button class="btn" style="padding: 0.35rem 0.8rem; font-size: 0.85rem;" onclick="startQuiz('${bankName}')">Start</button>
          <button class="btn btn-danger" onclick="deleteBank('${bankName}')">Slett</button>
        </div>
      `;
      bankListEl.appendChild(item);
    });
  }

  function startQuiz(bankName) {
    const banks = loadBanks();
    if (!banks[bankName] || banks[bankName].length === 0) return;

    currentBank = bankName;
    currentIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    const banks = loadBanks();
    const questions = banks[currentBank];
    const q = questions[currentIndex];

    document.getElementById("quizBankName").textContent = currentBank;
    document.getElementById("quizProgress").textContent = `${currentIndex + 1} / ${questions.length}`;
    document.getElementById("nextBtn").classList.add("hidden");

    const container = document.getElementById("questionContainer");
    container.innerHTML = `
      <div class="question-box">${q.question}</div>
      <div class="options-grid" id="optionsGrid"></div>
    `;

    const grid = document.getElementById("optionsGrid");
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(idx, q.answer, btn);
      grid.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex, correctIndex, clickedBtn) {
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) {
        btn.classList.add("correct");
      }
    });

    if (selectedIndex !== correctIndex) {
      clickedBtn.classList.add("wrong");
    }

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.classList.remove("hidden");
  }

  document.getElementById("nextBtn").onclick = () => {
    const banks = loadBanks();
    if (currentIndex < banks[currentBank].length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      document.getElementById("questionContainer").innerHTML = `
        <div class="question-box" style="text-align: center; color: var(--success); margin: 2rem 0;">
          🎉 Du har fullført hele spørsmålsbanken!
        </div>
      `;
      document.getElementById("nextBtn").classList.add("hidden");
    }
  };

  // Import-håndtering
  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        if (!Array.isArray(data)) throw new Error("Formatet må være en liste (array)");

        const bankName = file.name.replace(/\.[^/.]+$/, "");
        const banks = loadBanks();
        banks[bankName] = data;
        saveBanks(banks);

        alert(`Importerte ${data.length} spørsmål til "${bankName}".`);
        e.target.value = "";
      } catch (err) {
        alert("Feil ved innlesing av fil: " + err.message);
      }
    };
    reader.readAsText(file);
  });

  // Init
  renderBankList();
  updateTotalStats();
</script>

</body>
</html>
