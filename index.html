<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Exam & Mastery Practice Suite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }

    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.6rem; font-size: 0.85rem; }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Word Import styling */
    .textarea-import { width: 100%; height: 140px; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: monospace; margin-top: 1rem; resize: vertical; line-height: 1.4; }

    /* Bank management styling */
    .bank-list { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    .bank-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
    .bank-meta { display: flex; flex-direction: column; gap: 0.2rem; min-width: 150px; }
    .bank-name { font-weight: 600; color: var(--text); }
    .bank-count { font-size: 0.85rem; color: var(--text-muted); }
    .bank-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    
    .select-exam { background: #1e293b; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem; font-size: 0.85rem; outline: none; }

    /* Quiz styling */
    .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.2rem; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.85rem; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #13203c; }
    .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--success) !important; color: var(--success); }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: var(--danger); }
    
    .status-bar { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Offline Exam & Mastery Practice Suite</h1>
    <div id="stats" class="bank-count">0 spørsmål totalt</div>
  </header>

  <!-- Word Import Section -->
  <section class="card">
    <h2 style="font-size: 1.15rem; margin-bottom: 0.5rem;">Lim inn direkte fra Word</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">
      Kopier spørsmålene dine rett fra dokumentet og lim dem inn her. Appen fjerner automatisk numrene og bygger spørsmålsbanken.
    </p>
    <textarea id="wordInput" class="textarea-import" placeholder="1. What is the minimum altitude...\n a) 1000 ft\n*b) 2000 ft\n c) 3000 ft"></textarea>
    <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
      <button class="btn" onclick="parseWordText()">Konverter og lagre til bank</button>
    </div>
  </section>

  <!-- Bank Management Section -->
  <section class="card">
    <h2 style="font-size: 1.15rem; margin-bottom: 0.5rem;">Dine Spørsmålsbanker</h2>
    <div class="bank-list" id="bankList">
      <!-- Genereres dynamisk -->
    </div>
  </section>

  <!-- Quiz Runner Section -->
  <section class="card" id="quizCard">
    <div class="status-bar">
      <span id="quizBankName">Ingen bank valgt</span>
      <span id="quizProgress">0 / 0</span>
    </div>
    <div id="questionContainer">
      <p style="color: var(--text-muted);">Velg en spørsmålsbank for å starte.</p>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
      <button id="nextBtn" class="btn hidden">Neste spørsmål</button>
    </div>
  </section>
</div>

<script>
  const STORAGE_KEY = "offline_exam_banks";
  let currentBank = null;
  let activeQuestions = [];
  let wrongQuestions = [];
  let currentIndex = 0;

  function loadBanks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } 
    catch { return {}; }
  }

  function saveBanks(banks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(banks));
    renderBankList();
    updateTotalStats();
  }

  function updateTotalStats() {
    const banks = loadBanks();
    let totalQuestions = 0;
    Object.values(banks).forEach(qList => totalQuestions += qList.length);
    document.getElementById("stats").textContent = `${totalQuestions} spørsmål fordelt på ${Object.keys(banks).length} banker`;
  }

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function parseWordText() {
    const text = document.getElementById("wordInput").value;
    if (!text.trim()) { alert("Tekstfeltet er tomt."); return; }

    const lines = text.split('\n');
    const questions = [];
    let currentQ = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;
      line = line.replace(/^\[.*?\]\s*/, '');

      if (/^\d+\./.test(line)) {
        if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
        currentQ = { question: line.replace(/^\d+\.\s*/, ''), options: [], answer: 0 };
      } else if (/^\*?\s?[a-e]\)/i.test(line)) {
        if (currentQ) {
          const isCorrect = line.includes('*');
          const optText = line.replace(/^\*?\s?[a-e]\)\s*/i, '');
          currentQ.options.push(optText);
          if (isCorrect) currentQ.answer = currentQ.options.length - 1;
        }
      } else if (currentQ && currentQ.options.length === 0) {
        currentQ.question += " " + line;
      }
    }

    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
    if (questions.length === 0) {
      alert("Klarte ikke å finne noen spørsmål. Sjekk formatet.");
      return;
    }

    const bankName = prompt(`Fant ${questions.length} spørsmål! Gi denne spørsmålsbanken et navn:`, "Ny Spørsmålsbank");
    if (bankName) {
      const banks = loadBanks();
      if (banks[bankName]) {
        if (!confirm(`Banken "${bankName}" eksisterer allerede. Overskrive?`)) return;
      }
      banks[bankName] = questions;
      saveBanks(banks);
      alert(`Lagret ${questions.length} spørsmål i banken "${bankName}".`);
      document.getElementById("wordInput").value = "";
    }
  }

  function deleteBank(bankName) {
    if (!confirm(`Vil du slette "${bankName}"?`)) return;
    const banks = loadBanks();
    delete banks[bankName];
    saveBanks(banks);

    if (currentBank === bankName) {
      currentBank = null; activeQuestions = []; wrongQuestions = []; currentIndex = 0;
      document.getElementById("quizBankName").textContent = "Ingen bank valgt";
      document.getElementById("quizProgress").textContent = "0 / 0";
      document.getElementById("questionContainer").innerHTML = '<p style="color: var(--text-muted);">Velg en spørsmålsbank for å starte.</p>';
      document.getElementById("nextBtn").classList.add("hidden");
    }
  }

  function renderBankList() {
    const banks = loadBanks();
    const bankListEl = document.getElementById("bankList");
    bankListEl.innerHTML = "";

    const bankKeys = Object.keys(banks);
    if (bankKeys.length === 0) {
      bankListEl.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Ingen banker lagret.</p>';
      return;
    }

    bankKeys.forEach((bankName, index) => {
      const qCount = banks[bankName].length;
      const selectId = `mode-${index}`;
      
      const item = document.createElement("div");
      item.className = "bank-item";
      item.innerHTML = `
        <div class="bank-meta">
          <span class="bank-name">${bankName}</span>
          <span class="bank-count">${qCount} spørsmål totalt</span>
        </div>
        <div class="bank-actions">
          <select id="${selectId}" class="select-exam">
            <option value="all">Ta alle (${qCount})</option>
            <option value="10">Eksamen (10 spm)</option>
            <option value="20">Eksamen (20 spm)</option>
            <option value="50">Eksamen (50 spm)</option>
          </select>
          <button class="btn" style="padding: 0.35rem 0.8rem; font-size: 0.85rem;" onclick="startQuiz('${bankName}', document.getElementById('${selectId}').value)">Start</button>
          <button class="btn btn-danger" onclick="deleteBank('${bankName}')">Slett</button>
        </div>
      `;
      bankListEl.appendChild(item);
    });
  }

  function startQuiz(bankName, mode) {
    const banks = loadBanks();
    if (!banks[bankName] || banks[bankName].length === 0) return;
    
    currentBank = bankName;
    currentIndex = 0;
    wrongQuestions = [];
    
    let allQ = [...banks[bankName]];
    
    if (mode === "all") {
      activeQuestions = allQ;
    } else {
      let count = parseInt(mode);
      if (count > allQ.length) count = allQ.length;
      activeQuestions = shuffleArray(allQ).slice(0, count);
    }
    
    renderQuestion();
  }

  function retryWrongQuestions() {
    activeQuestions = shuffleArray([...wrongQuestions]);
    wrongQuestions = [];
    currentIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    const q = activeQuestions[currentIndex];

    document.getElementById("quizBankName").textContent = currentBank;
    document.getElementById("quizProgress").textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
    document.getElementById("nextBtn").classList.add("hidden");

    const container = document.getElementById("questionContainer");
    container.innerHTML = `
      <div class="question-box">${q.question}</div>
      <div class="options-grid" id="optionsGrid"></div>
    `;

    const grid = document.getElementById("optionsGrid");
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(idx, q.answer, btn);
      grid.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex, correctIndex, clickedBtn) {
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) btn.classList.add("correct");
    });

    if (selectedIndex !== correctIndex) {
      clickedBtn.classList.add("wrong");
      wrongQuestions.push(activeQuestions[currentIndex]);
    }
    document.getElementById("nextBtn").classList.remove("hidden");
  }

  document.getElementById("nextBtn").onclick = () => {
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      let endMessage = `<div class="question-box" style="text-align: center; color: var(--success); margin: 1rem 0;">🎉 Du har fullført!</div>`;
      
      if (wrongQuestions.length > 0) {
        endMessage += `<p style="text-align:center; color: var(--text-muted); margin-bottom: 1.5rem;">Du hadde <b>${wrongQuestions.length}</b> feil av ${activeQuestions.length} mulige.</p>`;
        endMessage += `<div style="display:flex; justify-content:center;"><button class="btn btn-danger" onclick="retryWrongQuestions()">Repeter ${wrongQuestions.length} feil</button></div>`;
      } else {
        endMessage += `<p style="text-align:center; color: var(--success);">Alt var riktig! Strålende jobbet.</p>`;
      }

      document.getElementById("questionContainer").innerHTML = endMessage;
      document.getElementById("nextBtn").classList.add("hidden");
    }
  };

  // Init
  renderBankList();
  updateTotalStats();
</script>

</body>
</html>
